version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: activities-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: activities_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - activities-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: activities-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/activities_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - activities-network

  frontend:
    build: ./frontend
    container_name: activities-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - activities-network

networks:
  activities-network:
    driver: bridge

volumes:
  mysql-data:
